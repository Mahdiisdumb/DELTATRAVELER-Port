<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | DELTATRAVELER</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #unity-canvas {
            width: 640px;
            height: 480px;
            background: #000000;
        }
    </style>
</head>

<body>

    <canvas
        id="unity-canvas"
        width="640"
        height="480">
    </canvas>

    <script src="Build/DELTATRAVELER.loader.js"></script>

    <script>
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content =
                'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';

            document.getElementsByTagName('head')[0].appendChild(meta);

            var canvas = document.querySelector("#unity-canvas");
            canvas.style.width = "100%";
            canvas.style.height = "100%";
            canvas.style.position = "fixed";

            document.body.style.textAlign = "left";
        }

        async function loadGame() {
            const part1 = await fetch(
                "Build/DELTATRAVELER.data.unityweb.part1"
            );

            const part2 = await fetch(
                "Build/DELTATRAVELER.data.unityweb.part2"
            );

            if (!part1.ok || !part2.ok) {
                throw new Error(
                    "Failed to download one or both data parts."
                );
            }

            const blob = new Blob([
                await part1.blob(),
                await part2.blob()
            ]);

            const dataUrl = URL.createObjectURL(blob);

            createUnityInstance(
                document.querySelector("#unity-canvas"),
                {
                    dataUrl: dataUrl,
                    frameworkUrl:
                        "Build/DELTATRAVELER.framework.js.unityweb",
                    codeUrl:
                        "Build/DELTATRAVELER.wasm.unityweb",
                    streamingAssetsUrl: "StreamingAssets",
                    companyName: "RynoGG",
                    productName: "DELTATRAVELER",
                    productVersion: "3.0.13.0114"
                }
            );
        }

        loadGame().catch(console.error);
    </script>

</body>
</html>
