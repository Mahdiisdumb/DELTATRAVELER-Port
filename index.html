<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">

    <title>Unity WebGL Player | DELTATRAVELER</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #unity-canvas {
            background: #000;
        }
    </style>
</head>

<body>

    <canvas
        id="unity-canvas"
        width="640"
        height="480"
        style="width: 640px; height: 480px; background: #000;">
    </canvas>

    <script src="Build/DELTATRAVELER.loader.js"></script>

    <script>
        async function loadGame() {
            const part1 = await fetch(
                "Build/DELTATRAVELER.data.unityweb.part1"
            );

            const part2 = await fetch(
                "Build/DELTATRAVELER.data.unityweb.part2"
            );

            if (!part1.ok || !part2.ok) {
                throw new Error(
                    "Failed to download one or both data parts."
                );
            }

            const blob = new Blob([
                await part1.blob(),
                await part2.blob()
            ]);

            const dataUrl = URL.createObjectURL(blob);

            const canvas = document.querySelector("#unity-canvas");

            createUnityInstance(canvas, {
                dataUrl: dataUrl,
                frameworkUrl:
                    "Build/DELTATRAVELER.framework.js.unityweb",
                codeUrl:
                    "Build/DELTATRAVELER.wasm.unityweb",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "RynoGG",
                productName: "DELTATRAVELER",
                productVersion: "3.0.13.0114"
            }).then(function(instance) {

                // Unity has initialized successfully.
                // Only now change the displayed canvas size.
                canvas.style.width = "100vw";
                canvas.style.height = "100vh";
                canvas.style.position = "fixed";
                canvas.style.left = "0";
                canvas.style.top = "0";
            });
        }

        loadGame().catch(console.error);
    </script>

</body>
</html>
